##############################################################################
# cvx-chat — Self-Hosted Convex Stack
#
# Services:
#   postgres      — Primary database for Convex backend
#   minio         — S3-compatible object storage (files, exports, snapshots…)
#   minio-init    — One-shot sidecar that creates the required MinIO buckets
#   cvx_backend   — Convex backend (uses postgres + minio)
#   cvx_dashboard — Convex admin dashboard
#
# Copy .env.example → .env and fill in your values before starting.
##############################################################################

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — Convex primary datastore
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-convex}
      POSTGRES_USER:     ${POSTGRES_USER:-convex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-convexsecret}
      # Passed to the init script so it can create the Convex-named database
      INSTANCE_NAME:     ${INSTANCE_NAME:-cvx-chat}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-convex} -d ${POSTGRES_DB:-convex}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible object storage
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # MinIO Init — creates required Convex buckets (runs once, then exits)
  # ---------------------------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_STORAGE_FILES_BUCKET:            ${S3_STORAGE_FILES_BUCKET:-convex-files}
      S3_STORAGE_MODULES_BUCKET:          ${S3_STORAGE_MODULES_BUCKET:-convex-modules}
      S3_STORAGE_EXPORTS_BUCKET:          ${S3_STORAGE_EXPORTS_BUCKET:-convex-exports}
      S3_STORAGE_SEARCH_BUCKET:           ${S3_STORAGE_SEARCH_BUCKET:-convex-search}
      S3_STORAGE_SNAPSHOT_IMPORTS_BUCKET: ${S3_STORAGE_SNAPSHOT_IMPORTS_BUCKET:-convex-snapshot-imports}
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 \$MINIO_ROOT_USER \$MINIO_ROOT_PASSWORD &&
        mc mb --ignore-existing local/\$S3_STORAGE_FILES_BUCKET &&
        mc mb --ignore-existing local/\$S3_STORAGE_MODULES_BUCKET &&
        mc mb --ignore-existing local/\$S3_STORAGE_EXPORTS_BUCKET &&
        mc mb --ignore-existing local/\$S3_STORAGE_SEARCH_BUCKET &&
        mc mb --ignore-existing local/\$S3_STORAGE_SNAPSHOT_IMPORTS_BUCKET &&
        echo 'All MinIO buckets ready.'
      "

  # ---------------------------------------------------------------------------
  # Convex Backend
  # ---------------------------------------------------------------------------
  cvx_backend:
    image: ghcr.io/get-convex/convex-backend:latest
    restart: unless-stopped
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "${PORT:-3210}:3210"
      - "${SITE_PROXY_PORT:-3211}:3211"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      # ---- Instance identity ----
      - INSTANCE_NAME=${INSTANCE_NAME:-cvx-chat}
      - INSTANCE_SECRET=${INSTANCE_SECRET}

      # ---- Performance tuning ----
      - APPLICATION_MAX_CONCURRENT_MUTATIONS=${APPLICATION_MAX_CONCURRENT_MUTATIONS:-16}
      - APPLICATION_MAX_CONCURRENT_NODE_ACTIONS=${APPLICATION_MAX_CONCURRENT_NODE_ACTIONS:-16}
      - APPLICATION_MAX_CONCURRENT_QUERIES=${APPLICATION_MAX_CONCURRENT_QUERIES:-16}
      - APPLICATION_MAX_CONCURRENT_V8_ACTIONS=${APPLICATION_MAX_CONCURRENT_V8_ACTIONS:-16}
      - V8_ACTION_USER_TIMEOUT_SECS
      - NODE_ACTION_USER_TIMEOUT_SECS

      # ---- PostgreSQL ----
      # IMPORTANT: Do NOT include a database name in the URL path.
      # Convex derives the db name from INSTANCE_NAME (hyphens become underscores,
      # e.g. "cvx-chat" → uses database "cvx_chat"). Create that DB in postgres first.
      - POSTGRES_URL=postgresql://${POSTGRES_USER:-convex}:${POSTGRES_PASSWORD:-convexsecret}@postgres:5432

      # ---- MinIO / S3 ----
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_S3_FORCE_PATH_STYLE=true
      - AWS_S3_DISABLE_CHECKSUMS=true
      - AWS_S3_DISABLE_SSE=true
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_STORAGE_FILES_BUCKET=${S3_STORAGE_FILES_BUCKET:-convex-files}
      - S3_STORAGE_MODULES_BUCKET=${S3_STORAGE_MODULES_BUCKET:-convex-modules}
      - S3_STORAGE_EXPORTS_BUCKET=${S3_STORAGE_EXPORTS_BUCKET:-convex-exports}
      - S3_STORAGE_SEARCH_BUCKET=${S3_STORAGE_SEARCH_BUCKET:-convex-search}
      - S3_STORAGE_SNAPSHOT_IMPORTS_BUCKET=${S3_STORAGE_SNAPSHOT_IMPORTS_BUCKET:-convex-snapshot-imports}

      # ---- Convex origins ----
      - CONVEX_CLOUD_ORIGIN=${CONVEX_CLOUD_ORIGIN:-http://127.0.0.1:${PORT:-3210}}
      - CONVEX_SITE_ORIGIN=${CONVEX_SITE_ORIGIN:-http://127.0.0.1:${SITE_PROXY_PORT:-3211}}

      # ---- Misc ----
      - DISABLE_BEACON=${DISABLE_BEACON:-true}
      - DISABLE_METRICS_ENDPOINT=${DISABLE_METRICS_ENDPOINT:-true}
      - DOCUMENT_RETENTION_DELAY=${DOCUMENT_RETENTION_DELAY:-172800}
      - DO_NOT_REQUIRE_SSL=${DO_NOT_REQUIRE_SSL:-true}
      - REDACT_LOGS_TO_CLIENT
      - RUST_LOG=${RUST_LOG:-info}
      - RUST_BACKTRACE
      - CONVEX_RELEASE_VERSION_DEV

    healthcheck:
      test: curl -f http://localhost:3210/version
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Convex Dashboard
  # ---------------------------------------------------------------------------
  cvx_dashboard:
    image: ghcr.io/get-convex/convex-dashboard:latest
    restart: unless-stopped
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "${DASHBOARD_PORT:-6791}:6791"
    environment:
      - NEXT_PUBLIC_DEPLOYMENT_URL=${NEXT_PUBLIC_DEPLOYMENT_URL:-http://127.0.0.1:${PORT:-3210}}
      - NEXT_PUBLIC_LOAD_MONACO_INTERNALLY
    depends_on:
      cvx_backend:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Convex Client Frontend (Next.js Standalone)
  # ---------------------------------------------------------------------------
  cvx_frontend:
    build:
      context: ./cvx_client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CONVEX_URL: ${NEXT_PUBLIC_CONVEX_URL:-http://127.0.0.1:${PORT:-3210}}
        NEXT_PUBLIC_CONVEX_SITE_URL: ${NEXT_PUBLIC_CONVEX_SITE_URL:-http://127.0.0.1:${SITE_PROXY_PORT:-3211}}
    image: softvence/convex-client-frontend:latest
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_CONVEX_URL=${NEXT_PUBLIC_CONVEX_URL:-http://127.0.0.1:${PORT:-3210}}
      - NEXT_PUBLIC_CONVEX_SITE_URL=${NEXT_PUBLIC_CONVEX_SITE_URL:-http://127.0.0.1:${SITE_PROXY_PORT:-3211}}
    depends_on:
      cvx_backend:
        condition: service_healthy

# ---------------------------------------------------------------------------
# Named Volumes
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local